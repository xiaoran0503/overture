# Schema version of this configuration file. Omit it for legacy configs;
# a value different from the build's supported version prints a warning
# pointing at MIGRATION.md instead of refusing to start.
configVersion: 2.1

bindAddress: :53
debugHTTPAddress: 127.0.0.1:5555
debugHTTPToken:
dohEnabled: false
primaryDNS:
  # DNS over QUIC 上游示例（v2.3.0+，RFC 9250）：
  #   - name: Quad9-DoQ
  #     address: doq://dns.quad9.net:853   # 或 quic:// 前缀（兼容写法）
  #     protocol: doq
  #     timeout: 8
  # 注意：IP 直连必须写 SNI：doq://dns.alidns.com@223.5.5.5:853；纯 IP 会被拒绝；
  #      DoQ 上游暂不支持 socks5Address；阿里公共 DNS 免费版当前仅 DoH/DoT。
  - name: DNSPod
    address: 119.29.29.29:53
    protocol: udp
    socks5Address:
    timeout: 6
    ednsClientSubnet:
      policy: disable
      externalIP:
      noCookie: true
alternativeDNS:
  - name: 114DNS
    address: 114.114.114.114:53
    protocol: udp
    socks5Address:
    timeout: 6
    ednsClientSubnet:
      policy: disable
      externalIP:
      noCookie: true
onlyPrimaryDNS: false
ipv6UseAlternativeDNS: false
alternativeDNSConcurrent: false
whenPrimaryDNSAnswerNoneUse: primaryDNS
ipNetworkFile:
  primary: ./ip_network_primary_sample
  alternative: ./ip_network_alternative_sample
domainFile:
  primary: ./domain_primary_sample
  alternative: ./domain_alternative_sample
  matcher: full-map
hostsFile:
  hostsFile: ./hosts_sample
  finder: full-map
minimumTTL: 0
domainTTLFile: ./domain_ttl_sample
cacheSize: 0
cacheRedisUrl:
cacheRedisConnectionPoolSize:
rejectQType:
  - 255
