name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Create test fixtures
        run: python3 build.py -create-sample
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
      - name: Verify modules
        run: go mod verify
      - name: Run vet
        run: go vet ./...
      - name: Run tests
        run: go test -shuffle=on -count=20 ./...
      - name: Run race tests
        run: go test -race ./...
      - name: Run static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: Check reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build Linux amd64
        run: CGO_ENABLED=1 CC=gcc GOOS=linux GOARCH=amd64 go build -trimpath -o overture ./main
